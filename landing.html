<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domanda importante</title>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --text: #e2e8f0; --food: #f59e0b; --drinks: #3b82f6; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; justify-content: center;
             background: linear-gradient(rgba(15, 23, 42, 0.3), rgba(15, 23, 42, 0.3)), 
                url('https://raw.githubusercontent.com/cosimorosato00/sito_comple/refs/heads/main/imgs/landingimgs/diva.webp');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
             }
        .container { 
            /* Colore scuro con opacità al 70% */
            background: rgba(30, 41, 59, 0.7); 
            /* Effetto sfocatura dietro il container */
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            
            padding: 3rem; 
            border-radius: 12px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); 
            max-width: 600px; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.1); /* Un bordo leggero aiuta la definizione */
        }
        h1 { margin-top: 0; font-size: 2rem; margin-bottom: 0.5rem; }
        .disclaimer { color: #94a3b8; margin-bottom: 2.5rem; font-size: 1.1rem;}
        
        .stats-box { background: #0f172a; padding: 1rem; border-radius: 8px; margin-bottom: 2rem; border: 1px solid #334155; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; text-align: center; }
        .stat-item { font-size: 1.5rem; font-weight: bold; }
        .stat-label { font-size: 0.9rem; color: #94a3b8; font-weight: normal; margin-top: 5px; display: block;}
        
        .choices { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
        .choice-btn { flex: 1; min-width: 200px; padding: 1.5rem; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.2rem; transition: transform 0.2s, filter 0.2s; color: white; display:flex; flex-direction: column; align-items: center; gap: 10px;}
        .choice-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        .btn-food { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-drinks { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .emoji { font-size: 3rem; margin-bottom: 5px;}
        .btn-icon {
            width: 200px;       /* Dimensione fissa dell'icona */
            height: 200px;
            object-fit: contain; /* Mantiene le proporzioni dell'immagine */
            margin-bottom: 10px;
        }
        
        .choice-btn {
            /* Manteniamo le tue proprietà, aggiungiamo solo il flex per allineare */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Se sei qui sei una personcina importante</h1>
        <p class="disclaimer">Raga è un gioco, però mica possiamo bere senza cibo o mangiare senza bere, quindi capiamo</p>
        
        <div class="stats-box">
            <h3 style="margin-top: 0; font-size: 1rem; margin-bottom: 1rem;">La situa è questa</h3>
            <div class="stats-grid">
                <div>
                    <span class="stat-item" id="foodCount" style="color: var(--food);">--</span>
                    <span class="stat-label">Quanti portano cibo</span>
                </div>
                <div>
                    <span class="stat-item" id="drinkCount" style="color: var(--drinks);">--</span>
                    <span class="stat-label">Quanti portano da bere</span>
                </div>
            </div>
        </div>

        <h3 style="margin-bottom: 1.5rem;">Tu cosa vuoi portare?</h3>
        <div class="choices">
            <a href="/food" class="choice-btn btn-food">
                <img src="https://raw.githubusercontent.com/cosimorosato00/sito_comple/refs/heads/main/imgs/buttonimgs/pizza.webp" alt="Cibo" class="btn-icon">
                Cucino qualcosa
            </a>
            <a href="/drinks" class="choice-btn btn-drinks">
                <img src="https://raw.githubusercontent.com/cosimorosato00/sito_comple/refs/heads/main/imgs/buttonimgs/noioso.webp" alt="Bevande" class="btn-icon">
                Sono noiosə e porto da bere
            </a>
        </div>
    </div>

    <script>
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                document.getElementById('foodCount').textContent = data.food;
                document.getElementById('drinkCount').textContent = data.drinks;
            })
            .catch(err => console.error(err));
    </script>
</body>
</html>
