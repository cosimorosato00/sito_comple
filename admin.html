<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello Admin - Prenotazioni</title>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --text: #e2e8f0; --accent: #ef4444; --accent-hover: #dc2626; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; margin: 0; }
        .container { background: var(--card-bg); padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); max-width: 800px; margin: 0 auto; }
        h1 { margin-top: 0; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-weight: 500; }
        .cancel-btn { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: background 0.2s;}
        .cancel-btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard Prenotazioni</h1>
        <p style="text-align:center; color:#94a3b8; margin-bottom: 2rem;">Gestione Varianti Occupate e Bevande. (Autenticato)</p>
        
        <h2 style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 2rem;">Lista Cibo Occupato 🍽️</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome Ospite</th>
                    <th>Categoria</th>
                    <th>Variante Occupata</th>
                    <th style="width: 120px;">Azione</th>
                </tr>
            </thead>
            <tbody id="bookingsTable">
                <tr><td colspan="4" style="text-align:center; padding: 2rem;">Caricamento in corso...</td></tr>
            </tbody>
        </table>

        <h2 style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 3rem;">Lista Bevande 🍺</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome Ospite</th>
                    <th>Cosa Porta</th>
                    <th style="width: 120px;">Azione</th>
                </tr>
            </thead>
            <tbody id="beveragesTable">
                <tr><td colspan="3" style="text-align:center; padding: 2rem;">Caricamento in corso...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE = '/api';

        function loadBookings() {
            fetch(`${API_BASE}/admin/bookings`)
                .then(res => {
                    if (res.status === 401) {
                        alert("Non autorizzato. Assicurati di aver inserito utente e password.");
                        throw new Error("Unauthorized");
                    }
                    return res.json();
                })
                .then(data => {
                    const tbody = document.getElementById('bookingsTable');
                    tbody.innerHTML = '';
                    if(data.length === 0){
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding: 2rem;">Nessuna prenotazione cibo attiva.</td></tr>';
                    } else {
                        data.forEach(variant => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td style="font-weight: bold;">${variant.booked_by || '<span style="color:#ef4444">Anonimo</span>'}</td>
                                <td style="color: #3b82f6;">${variant.category ? variant.category.name : '-'}</td>
                                <td>${variant.name}</td>
                                <td>
                                    <button class="cancel-btn" onclick="cancelBooking(${variant.id}, this)">❌ Annulla</button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                }).catch(err => console.log(err));
            
            // Carica Bevande
            fetch(`${API_BASE}/admin/beverages`)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('beveragesTable');
                    tbody.innerHTML = '';
                    if(data.length === 0){
                        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#94a3b8; padding: 2rem;">Nessuna bevanda registrata.</td></tr>';
                        return;
                    }
                    data.forEach(drink => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="font-weight: bold;">${drink.booked_by}</td>
                            <td>${drink.beverage_name}</td>
                            <td>
                                <button class="cancel-btn" onclick="cancelBeverage(${drink.id}, this)">❌ Annulla</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }

        function cancelBooking(variantId, btn) {
            if(!confirm("Sicuro di voler ANNULLARE questa prenotazione? Il piatto tornerà disponibile e prenotabile da chiunque.")) return;
            btn.disabled = true;
            btn.innerText = "Attendere...";
            btn.style.opacity = '0.5';

            fetch(`${API_BASE}/admin/variants/${variantId}/cancel`, { method: 'POST' })
                .then(res => {
                    if(res.ok) {
                        btn.closest('tr').remove();
                        const tbody = document.getElementById('bookingsTable');
                        if(tbody.children.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding: 2rem;">Nessuna prenotazione attiva al momento.</td></tr>';
                        }
                    } else {
                        alert("Errore durante l'annullamento.");
                        btn.disabled = false;
                        btn.innerText = "❌ Annulla";
                        btn.style.opacity = '1';
                    }
                });
        }

        function cancelBeverage(drinkId, btn) {
            if(!confirm("Sicuro di voler cancellare questa bevanda?")) return;
            btn.disabled = true;
            btn.innerText = "Attendere...";
            btn.style.opacity = '0.5';

            fetch(`${API_BASE}/admin/beverages/${drinkId}/cancel`, { method: 'POST' })
                .then(res => {
                    if(res.ok) {
                        btn.closest('tr').remove();
                        const tbody = document.getElementById('beveragesTable');
                        if(tbody.children.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#94a3b8; padding: 2rem;">Nessuna bevanda registrata.</td></tr>';
                        }
                    } else {
                        alert("Errore.");
                        btn.disabled = false;
                        btn.innerText = "❌ Annulla";
                        btn.style.opacity = '1';
                    }
                });
        }

        loadBookings();
    </script>
</body>
</html>
