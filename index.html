<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciboooo</title>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --text: #e2e8f0; --accent: #3b82f6; --accent-hover: #2563eb; }
        /* 1. Impostazioni body per lo sfondo */
body { 
    font-family: 'Inter', system-ui, sans-serif; 
    background: #0f172a; /* Colore di base */
    background-image: url('https://raw.githubusercontent.com/cosimorosato00/sito_comple/refs/heads/main/imgs/landingimgs/ilpo.webp');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--text); 
    padding: 2rem; 
    display: flex; 
    justify-content: center; 
    align-items: flex-start; 
    min-height: 100vh; 
    margin: 0; 
}

/* 2. Container con effetto vetro */
.container { 
    background: rgba(30, 41, 59, 0.7); /* Semitrasparenza */
    backdrop-filter: blur(10px); 
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 2.5rem; 
    border-radius: 12px; 
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); 
    width: 100%; 
    max-width: 500px; 
    margin-top: 5vh; 
}
        h1 { margin-top: 0; font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
        .input-group { position: relative; margin-bottom: 2rem; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; transition: border-color 0.2s; box-sizing: border-box; font-size: 1rem; }
        input:focus { border-color: var(--accent); }
        .autocomplete-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--card-bg); border: 1px solid #334155; border-radius: 8px; margin-top: 4px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); z-index: 10; max-height: 200px; overflow-y: auto; display: none; }
        .autocomplete-item { padding: 10px 12px; cursor: pointer; transition: background 0.2s; }
        .autocomplete-item:hover { background: #334155; }
        .variants-list { display: grid; gap: 10px; margin-top: 1rem; }
        .variant-card { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 12px; border-radius: 8px; gap: 10px; }
        .variant-name { word-break: break-word; }
        .book-btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: background 0.2s; flex-shrink: 0; }
        .book-btn:hover { background: var(--accent-hover); }
        #message { margin-top: 1rem; text-align: center; font-size: 0.9rem; padding: 10px; border-radius: 6px; display: none; border: 1px solid transparent; }
        .success { background: rgba(6, 78, 59, 0.3); color: #34d399; border-color: rgba(52, 211, 153, 0.2) !important; }
        .modal-success-bg {
        /* Sostituisci il link con la tua immagine */
        background: linear-gradient(rgba(30, 41, 59, 0.3), rgba(30, 41, 59, 0.3)), 
                    url('https://raw.githubusercontent.com/cosimorosato00/sito_comple/refs/heads/main/imgs/buttonimgs/swag2.webp');
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        /* Opzionale: aggiungi un bordo per staccare dallo sfondo scuro del popup */
        border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-bg {
            /* Impostiamo l'immagine di sfondo */
            background: linear-gradient(rgba(30, 41, 59, 0.3), rgba(30, 41, 59, 0.3)), 
                        url('https://raw.githubusercontent.com/cosimorosato00/sito_comple/refs/heads/main/imgs/buttonimgs/cuffia2.webp');
            background-size: cover;
            background-position: center;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            
            /* Questo assicura che il modale non diventi minuscolo */
            min-width: 300px;
            /* Questo assicura che non diventi enorme */
            max-width: 90vw;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .error { background: rgba(127, 29, 29, 0.3); color: #fca5a5; border-color: rgba(252, 165, 165, 0.2) !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>Che vuoi portare? (Solo piatti con la C)</h1>
        
        <div class="input-group">
            <input type="text" id="searchInput" placeholder="Cerca una tipo di piatto (min 3 lettere)..." autocomplete="off">
            <div id="autocompleteDropdown" class="autocomplete-dropdown"></div>
        </div>

        <div id="variantsContainer" style="display: none;">
            <h3 style="margin-bottom: 0.5rem; border-bottom: 1px solid #334155; padding-bottom: 10px; font-size: 1.1rem; font-weight: 500;" id="selectedCategoryTitle">Scegli la tua Variante</h3>
            <div id="variantsList" class="variants-list"></div>
        </div>
    </div>

    <!-- Modale Inserimento Nome -->
    <div id="nameInputModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
        <div class="modal-bg">
            <h2 style="margin-top: 0; margin-bottom: 0.5rem; color: white;">Chi sei?</h2>
            <p style="color: #e2e8f0; font-size: 0.95rem; margin-bottom: 1.5rem;">Stai portando: <span id="targetVariantName" style="color: white; font-weight: bold;"></span></p>
            <input type="text" id="bookingNameInput" placeholder="Posso un autografo?" style="margin-bottom: 1.5rem; font-size: 1.1rem; padding: 15px; width: 100%; box-sizing: border-box;">
            <div style="display: flex; gap: 10px;">
                <button onclick="closeNameModal()" style="background: #475569; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; flex: 1;">Annulla</button>
                <button id="confirmBookingBtn" style="background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold;">Conferma</button>
            </div>
        </div>
    </div>

    <!-- Modale di Conferma Successo -->
    <div id="successModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
        <div class="modal-success-bg" style="padding: 2rem; border-radius: 12px; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 90%;">
            
            <h2 style="margin-top: 0; color: white;">Daje Roma</h2>
            <p id="modalVariantName" style="color: #e2e8f0; margin-bottom: 1.5rem; font-size: 1.1rem; font-weight: bold;"></p>
            
            <button onclick="document.getElementById('successModal').style.display='none'" style="background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; font-weight: bold;">Chiudi</button>
        </div>
    </div>

    <div id="selfieModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
        <div style="background: var(--card-bg); padding: 1.5rem; border-radius: 12px; text-align: center; width: 90%; max-width: 400px;">
            <h2 style="color: white; margin-top: 0;">Fatti un selfie!</h2>
            <video id="video" autoplay playsinline style="width: 100%; border-radius: 8px; background: black; margin-bottom: 1rem;"></video>
            <canvas id="canvas" style="display:none;"></canvas>
            
            <div style="display: flex; gap: 10px;">
                <button onclick="stopCamera()" style="background: #475569; color: white; border: none; padding: 12px; border-radius: 8px; flex: 1;">Annulla</button>
                <button id="snapBtn" style="background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; flex: 1; font-weight: bold;">Scatta</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        const sb = supabase.createClient('https://iyhsivbihzxkprlmtnkt.supabase.co', 'sb_publishable_n6pTi2kGWQXAaa2yJnKIrA_hfRGkVST');
        let searchTimeout;
        let currentBookingData = null; // Dati della prenotazione corrente
    
        const searchInput = document.getElementById('searchInput');
        const dropdown = document.getElementById('autocompleteDropdown');
        const variantsContainer = document.getElementById('variantsContainer');
        const variantsList = document.getElementById('variantsList');
        const selectedCategoryTitle = document.getElementById('selectedCategoryTitle');
    
        // Funzioni esistenti di gestione UI
        function showModal(variantName) {
            document.getElementById('modalVariantName').textContent = `Hai prenotato: ${variantName}`;
            document.getElementById('successModal').style.display = 'flex';
        }
    
        function showMessage(msg) { alert(msg); }
    
        // --- LOGICA SELFIE ---
        const video = document.getElementById('video');
        const selfieModal = document.getElementById('selfieModal');
    
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
                selfieModal.style.display = 'flex';
            } catch (err) { alert("Fotocamera non disponibile: " + err); }
        }
    
        function stopCamera() {
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());
            selfieModal.style.display = 'none';
        }
    
        // --- LOGICA AGGIORNATA PER LO SCATTO E UPLOAD ---
        document.getElementById('snapBtn').addEventListener('click', async () => {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
    
            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const fileName = `selfie_${currentBookingData.variantId}_${Date.now()}.webp`;
    
                // Usa 'sb' qui
                const { data, error } = await sb.storage
                    .from('fotine') 
                    .upload(fileName, blob, { contentType: 'image/webp' });
    
                if (error) {
                    console.error("Errore upload:", error);
                    alert("Errore caricamento: " + error.message);
                    return;
                }
    
                // Usa 'sb' anche qui
                const { data: urlData } = sb.storage
                    .from('fotine')
                    .getPublicUrl(fileName);
    
                await fetch(`${API_BASE}/variants/${currentBookingData.variantId}/update-photo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ photo_url: urlData.publicUrl })
                });
    
                stopCamera();
                showModal(currentBookingData.variantName);
            }, 'image/webp', 0.8);
        });
    
        // --- LOGICA RICERCA E PRENOTAZIONE ---
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            variantsContainer.style.display = 'none';
            clearTimeout(searchTimeout);
            if (query.length < 3) { dropdown.style.display = 'none'; return; }
            
            searchTimeout = setTimeout(() => {
                fetch(`${API_BASE}/categories?q=${encodeURIComponent(query)}`)
                    .then(res => res.json())
                    .then(data => {
                        dropdown.innerHTML = '';
                        if (data.length > 0) {
                            data.forEach(cat => {
                                const div = document.createElement('div');
                                div.className = 'autocomplete-item';
                                div.textContent = cat.name;
                                div.onclick = () => selectCategory(cat);
                                dropdown.appendChild(div);
                            });
                            dropdown.style.display = 'block';
                        } else { dropdown.style.display = 'none'; }
                    });
            }, 300);
        });
    
        function selectCategory(category) {
            searchInput.value = category.name;
            dropdown.style.display = 'none';
            selectedCategoryTitle.textContent = `Varianti per: ${category.name}`;
            
            fetch(`${API_BASE}/categories/${category.id}/variants`)
                .then(res => res.json())
                .then(variants => {
                    variantsList.innerHTML = '';
                    variants.forEach(variant => {
                        const div = document.createElement('div');
                        div.className = 'variant-card';
                        if(variant.is_available) {
                            div.innerHTML = `
                                <span class="variant-name">${variant.name}</span>
                                <button class="book-btn" onclick="bookVariant(${variant.id}, '${variant.name.replace(/'/g, "\\'")}', this, ${category.id})">Prenota</button>
                            `;
                        } else {
                            div.style.opacity = '0.6';
                            div.innerHTML = `<span class="variant-name" style="text-decoration: line-through; color: #94a3b8;">${variant.name}</span><span style="color: #ef4444; font-size: 0.85rem; font-weight: bold; flex-shrink: 0;">❌ Occupata</span>`;
                        }
                        variantsList.appendChild(div);
                    });
                    variantsContainer.style.display = 'block';
                });
        }
    
        function bookVariant(variantId, variantName, button, categoryId) {
            currentBookingData = { variantId, variantName, button, categoryId };
            document.getElementById('targetVariantName').textContent = variantName;
            document.getElementById('nameInputModal').style.display = 'flex';
        }
    
        function closeNameModal() { document.getElementById('nameInputModal').style.display = 'none'; }
    
        document.getElementById('confirmBookingBtn').onclick = () => {
            const nameInput = document.getElementById('bookingNameInput').value.trim();
            if (nameInput.length < 2) { alert("Inserisci un nome valido."); return; }
            
            const { variantId, button, categoryId } = currentBookingData;
            closeNameModal();
    
            button.disabled = true;
            button.innerText = "Attendere...";
    
            fetch(`${API_BASE}/variants/${variantId}/book`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ booked_by: nameInput })
            })
            .then(res => res.json().then(data => ({status: res.status, body: data})))
            .then(({status, body}) => {
                if (status === 200) {
                    // FLUSSO CONCATENATO: Successo -> Avvia fotocamera
                    startCamera(); 
                    selectCategory({ id: categoryId, name: searchInput.value });
                } else {
                    alert(body.detail || "Errore.");
                    button.disabled = false;
                    button.innerText = "Prenota";
                }
            });
        };
    </script>
</body>
</html>
